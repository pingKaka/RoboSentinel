# RoboSentinel streaming pipeline.
version: 4

task:
  id: "white_bottle_to_far_right_hole"
  description: "Pick the white-capped reagent bottle and place it in the far-right hole of the large test-tube rack."

streams:
  external_camera:
    provider: null
  wrist_camera:
    provider: null
  robot_state:
    enabled: false
    provider: null
  max_timestamp_delta_sec: 0.05

models:
  vlm: "checkpoint/Qwen3-VL-8B-Instruct"
  grounding_dino: "checkpoint/GroundingDINO-tiny"
  sam: "checkpoint/SAM2.1-hiera-small"

stages:
  planner:
    backend: "qwen3_vl"
  tracker:
    backend: "grounding_dino_sam_online"
  rules:
    plugins: []
  diagnosis:
    backend: "qwen3_vl_event_triggered"

runtime:
  buffer_seconds: 15.0

deployment:
  host: "0.0.0.0"
  port: 8000
  # Python factory path: package.module:function
  # The function receives the project config and returns StreamingRoboSentinel.
  pipeline_factory: null

outputs:
  event_log: "result/runtime/events.jsonl"
  diagnosis: "result/runtime/diagnosis.jsonl"
